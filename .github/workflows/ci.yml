name: CI
# repo-infra: ci v1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # repo-infra: ci-lib v1
  lib:
    name: Workflow library tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The release logic is a library, so it is tested like one. Before this,
      # the changelog roller was a Perl program inside a YAML string whose only
      # test was cutting a release.
      - name: Run the workflow library tests
        run: node --test .github/workflows/lib/*.test.js

  # repo-infra: ci-rust v2
  # D24. A bare `cargo test` runs the workspace's default members only, and a
  # root [package] makes that one crate. rust-plan reads the "rust" key of
  # .github/repo-infra.json and `cargo metadata`, and hands the two matrix
  # jobs below the crates they run for. Without the key, and where default
  # members equal members, it hands them one empty entry and they run the
  # workspace-wide commands. Every other case fails here, naming the crates.
  rust-plan:
    name: Rust workspace plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      test: ${{ steps.plan.outputs.test }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"

      - id: plan
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const ws = process.env.GITHUB_WORKSPACE;
            const { rustPlan } = require(`${ws}/.github/workflows/lib/rust-plan.js`);
            const configPath = `${ws}/.github/repo-infra.json`;
            const config = fs.existsSync(configPath)
              ? JSON.parse(fs.readFileSync(configPath, 'utf8'))
              : {};
            const metadata = JSON.parse(
              fs.readFileSync(`${process.env.RUNNER_TEMP}/cargo-metadata.json`, 'utf8'),
            );
            try {
              const plan = rustPlan(config, metadata);
              core.setOutput('lint', JSON.stringify(plan.lint));
              core.setOutput('test', JSON.stringify(plan.test));
              core.notice(`lint: ${plan.lint.join(', ') || 'workspace'}; `
                + `test: ${plan.test.join(', ') || 'workspace'}`);
            } catch (error) {
              core.setFailed(error.message);
            }

  rust-check:
    name: Rust check and lint ${{ matrix.package }}
    needs: rust-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.rust-plan.outputs.lint) }}
    env:
      CARGO_TERM_COLOR: always
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: cargo fmt --check ${PACKAGE:+-p "$PACKAGE"}

      # --no-deps with -p: clippy-driver replaces rustc for every workspace
      # member regardless of -p, so -p alone still lints vendored crates.
      - run: |
          if [ -n "$PACKAGE" ]; then
            cargo clippy --all-targets -p "$PACKAGE" --no-deps -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

  rust-test:
    name: Rust tests ${{ matrix.package }}
    needs: rust-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.rust-plan.outputs.test) }}
    env:
      CARGO_TERM_COLOR: always
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: cargo test ${PACKAGE:+-p "$PACKAGE"}

  # The single context the ruleset requires (spec D2). It exists so branch
  # protection can name one check that means "this repository's CI passed",
  # whatever this repository's jobs happen to be. The needs list is generated
  # by the assembler from the blocks that went into this file.
  #
  # `if: always()` is load-bearing. Without it this job is *skipped* when a
  # dependency fails, and a skipped job reports Success -- so the required
  # check would go green on a red build. It fails open, silently, and looks
  # like it is working.
  ci-passed:
    if: always()
    needs: [lib, rust-plan, rust-check, rust-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
