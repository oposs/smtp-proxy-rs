name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The same two targets, in the same order, that the release workflow
      # runs, so a failure here reproduces locally with `make lint test`.
      - run: make lint

      - run: make test

  musl:
    name: Static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      # This is the binary the release ships, so it is compiled on every pull
      # request rather than discovered at tag time -- when the tag is already
      # pushed and CHANGES already names the version. `make release` is
      # followed by `verify-static`, which asserts the link really is static.
      - run: make verify-static
