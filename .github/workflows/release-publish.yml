name: Publish release (automatic)
# repo-infra: release-publish v2
#
# ===========================================================================
#  TWO HAND-EDITS LIVE IN THIS FILE. `repo-infra apply` WILL REVERT BOTH.
#
#  1. The `publish-deb-container` job below is SMTP-PROXY-RS'S OWN. It is not
#     a standard publish add-on -- there is none for a .deb plus a container
#     image yet (ruling R32: prove it here, upstream it later). It is what
#     replaced the old tag-triggered release.yml.
#
#  2. `finalize`'s `needs:` is GENERATED by the assembler from the `publish`
#     list in .github/repo-infra.json. `publish-deb-container` is not in that
#     list, so the assembler does not know about it and does not put it there.
#     The line reads `needs: [publish, publish-deb-container]` and that second
#     entry was added BY HAND.
#
#  WHAT GOES WRONG IF YOU LOSE THEM. A reverted `needs:` does not fail: it
#  makes `finalize` stop waiting, so the release is flipped from draft to
#  public while the .deb and the binary are still being built. The release is
#  then visible, permanently, with no artifacts on it. Nothing reports an
#  error, because nothing went wrong -- it just did not wait.
#
#  SO: after EVERY `repo-infra apply` or standard update, re-read this file and
#  confirm both the job and the `needs:` entry are still here. `apply` refuses
#  to merge a file with local edits and drops .base/.new/.current under
#  .git/repo-infra/merge/ -- merge them by hand and keep both edits.
# ===========================================================================
#
# Half two. Merging the release pull request lands the rolled CHANGES.md on main,
# and that merge triggers this.
#
# This file is assembled, not copied: this frame, then one job block per publish
# add-on the repository installs, then the finalize job whose `needs:` list is
# generated from those blocks. That generated list is the reason the core never
# has to know which add-ons exist.
#
# There is deliberately no workflow_dispatch. Publishing should be a consequence
# of merging a release pull request, never something started from a dropdown.
# With main protected against direct pushes, that leaves exactly one route to a
# release. Recovery still does not need a manual trigger, but it needs the right
# button: `publish` is idempotent by tag presence, so once the tag exists a
# whole-workflow re-run finds it, sets no outputs, and skips every add-on and
# `finalize` -- the release stays a draft forever. Use the Actions UI's
# **Re-run failed jobs** instead: it keeps the successful job's outputs, so the
# jobs that failed run again against them and finish what the first attempt
# would have.

on:
  push:
    branches: [main]
    paths:
      - CHANGES.md

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.publish.outputs.version }}
      tag: ${{ steps.publish.outputs.tag }}
      release_id: ${{ steps.publish.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tag and create the draft release
        id: publish
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE;
            const lib = `${ws}/.github/workflows/lib`;
            const changesLib = require(`${lib}/changes.js`);
            const bumpLib = require(`${lib}/bump.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const fileIO = {
              read: (p) => fs.readFileSync(path.join(ws, p), 'utf8'),
              write: () => { throw new Error('the publisher never writes'); },
            };

            const config = JSON.parse(fileIO.read('.github/repo-infra.json'));

            // CHANGES.md is the source of truth. It is the only file every
            // repository has, and it changes on exactly one occasion.
            const release = changesLib.latestRelease(fileIO.read('CHANGES.md'));
            if (!release) {
              core.notice('CHANGES.md has no released version yet - nothing to do.');
              return;
            }
            const version = release.version;
            const tag = `v${version}`;

            // Every version file is a derived copy. If one disagrees, the release
            // pull request half-applied, and tagging now would repeat the failure
            // that shipped an inconsistent v0.1.1 elsewhere.
            const stale = config.version_files.filter(
              (spec) => !bumpLib.verifyFile(spec, version, fileIO)
            );
            if (stale.length > 0) {
              core.setFailed(
                `CHANGES.md says ${version} but these disagree: `
                + stale.map((s) => s.path).join(', ')
              );
              return;
            }

            // Idempotent: an ordinary pull request that edits [Unreleased] also
            // triggers this workflow, finds the tag already present, and stops.
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.notice(`${tag} is already tagged - nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Annotated, not a bare createRef. A bare ref makes a lightweight tag,
            // and `git describe` prefers annotated ones; the existing repositories
            // have annotated tags and a silent switch would change local tooling
            // behaviour for no reason.
            const makeTag = async (name, message) => {
              const { data: object } = await github.rest.git.createTag({
                owner, repo, tag: name, message, object: context.sha, type: 'commit',
              });
              return object.sha;
            };

            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${tag}`,
              sha: await makeTag(tag, `Release ${tag}`),
            });
            core.notice(`Tagged ${tag}.`);

            if (config.moving_major_tag) {
              const major = `v${version.split('.')[0]}`;
              const sha = await makeTag(major, `Update ${major} to ${tag}`);
              try {
                await github.rest.git.updateRef({
                  owner, repo, ref: `tags/${major}`, sha, force: true,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/tags/${major}`, sha,
                });
              }
              core.notice(`Moved ${major} to ${tag}.`);
            }

            // Draft, so publish add-ons (spec 2) can attach artifacts before
            // anyone sees the release. The finalize job below publishes it.
            const { data: created } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: tag,
              body: changesLib.notesFor(fileIO.read('CHANGES.md'), version),
              draft: true,
              prerelease: false,
              make_latest: 'true',
            });

            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('release_id', String(created.id));

  # ---------------------------------------------------------------------------
  # HAND-ADDED, NOT GENERATED. See the block at the top of this file.
  # This is the whole of what the deleted release.yml used to do, minus the
  # version derivation and the notes extraction, which `publish` above now does
  # from CHANGES.md. Adding another add-on job means adding its id to
  # `finalize`'s `needs:` as well.
  # ---------------------------------------------------------------------------
  publish-deb-container:
    name: Attach the .deb and the binary, push the container image
    needs: [publish]
    if: needs.publish.outputs.release_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cross
        # Pinned to a released version rather than `main`: a cross-compile is
        # the step least likely to have been rehearsed on a developer's
        # machine, so it must not rest on a moving dependency.
        run: cargo install cross --version 0.2.5 --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --version '^3.7' --locked

      # The same targets a developer runs locally, in the same order. `make
      # deb` depends on `verify-static`, which asserts the binary really is
      # statically linked -- `crt-static` is a hint the linker is free to
      # ignore, and a dynamically linked build fails on the operator's machine
      # rather than here. lint and test are run again here on purpose: this job
      # builds the artifact that ships, and it must not depend on having read
      # another workflow's result correctly.
      - name: Lint, test, build and package
        run: make lint test deb

      - name: Verify the package contents
        # Asserted rather than assumed: cargo-deb rewrites the `target/release/`
        # asset paths under --target, and a silent miss there produces a
        # package that installs nothing.
        run: |
          set -euo pipefail
          DEB=$(ls target/x86_64-unknown-linux-musl/debian/*.deb)
          echo "Package: ${DEB}"
          dpkg-deb -c "$DEB"
          for want in ./usr/bin/smtp-proxy \
                      ./usr/lib/systemd/system/smtp-proxy.service \
                      ./etc/default/smtp-proxy; do
            if ! dpkg-deb -c "$DEB" | grep -q " ${want}\$"; then
              echo "::error::${want} missing from ${DEB}"
              exit 1
            fi
          done

      - name: Stage the release assets
        run: |
          set -euo pipefail
          VERSION='${{ needs.publish.outputs.version }}'
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/smtp-proxy \
             "dist/smtp-proxy-${VERSION}-x86_64-unknown-linux-musl"
          cp target/x86_64-unknown-linux-musl/debian/*.deb dist/
          ls -la dist/

      - name: Attach them to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = `${process.env.GITHUB_WORKSPACE}/dist`;
            const TYPES = {
              '.deb': 'application/vnd.debian.binary-package',
            };
            const files = fs.readdirSync(dir).sort();
            // Two, always: the bare musl binary and the .deb. A count that is
            // not two means a staging step silently produced nothing, and
            // uploading whatever happened to be there would hide it.
            if (files.length !== 2) {
              core.setFailed(`expected one binary and one .deb, found ${files.length}: ${files.join(', ')}`);
              return;
            }
            for (const name of files) {
              const data = fs.readFileSync(path.join(dir, name));
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number('${{ needs.publish.outputs.release_id }}'),
                name,
                data,
                headers: {
                  'content-type': TYPES[path.extname(name)] || 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.notice(`Attached ${asset.name} (${asset.size} bytes).`);
            }

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile does its own musl build: `rust:1-alpine` is already a
      # native musl host, so it needs no cross-compilation and shares nothing
      # with the build above.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smtp-proxy:${{ needs.publish.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/smtp-proxy:latest

  finalize:
    name: Publish the release
    # Generated by the assembler: `publish`, then every add-on job installed in
    # this repository. An add-on that fails leaves the release a draft, which is
    # the correct outcome -- a release missing its artifacts must not be visible.
    #
    # HAND-EDITED: the assembler generates `[publish]` here, because
    # publish-deb-container is not a standard add-on and is not in the `publish`
    # list of .github/repo-infra.json. The next `apply` REVERTS this line, and a
    # reverted line does not fail -- it publishes the release before the .deb
    # exists. Re-add publish-deb-container after every standard update.
    needs: [publish, publish-deb-container]
    if: needs.publish.outputs.release_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: released } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number('${{ needs.publish.outputs.release_id }}'),
              draft: false,
            });
            core.notice(`Published ${released.html_url}`);
            await core.summary
              .addHeading(`Released ${{ needs.publish.outputs.tag }}`)
              .addLink('Release', released.html_url)
              .write();
