name: Release

# A `v*` tag is the trigger. Everything below is derived from that tag, so
# there is one place to get the version wrong and a check that catches it.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build static musl binary and .deb
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive and check the version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The tag and Cargo.toml must agree. If they do not, the release
          # would ship a binary whose --version contradicts its own filename,
          # and nothing later in this workflow would notice.
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cross
        # Pinned to a released version rather than `main`: a cross-compile is
        # the step least likely to have been rehearsed on a developer's
        # machine, so it must not rest on a moving dependency.
        run: cargo install cross --version 0.2.5 --locked

      - name: Install cargo-deb
        run: cargo install cargo-deb --version '^3.7' --locked

      # The same targets a developer runs locally, in the same order. `make
      # deb` depends on `verify-static`, which asserts the binary really is
      # statically linked -- `crt-static` is a hint the linker is free to
      # ignore, and a dynamically linked build fails on the operator's machine
      # rather than here.
      - name: Lint, test, build and package
        run: make lint test deb

      - name: Verify the package contents
        # Asserted rather than assumed: cargo-deb rewrites the `target/release/`
        # asset paths under --target, and a silent miss there produces a
        # package that installs nothing.
        run: |
          DEB=$(ls target/x86_64-unknown-linux-musl/debian/*.deb)
          echo "Package: ${DEB}"
          dpkg-deb -c "$DEB"
          for want in ./usr/bin/smtp-proxy \
                      ./usr/lib/systemd/system/smtp-proxy.service \
                      ./etc/default/smtp-proxy; do
            if ! dpkg-deb -c "$DEB" | grep -q " ${want}\$"; then
              echo "::error::${want} missing from ${DEB}"
              exit 1
            fi
          done

      - name: Stage release assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/smtp-proxy \
             "dist/smtp-proxy-${VERSION}-x86_64-unknown-linux-musl"
          cp target/x86_64-unknown-linux-musl/debian/*.deb dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: smtp-proxy-dist
          path: dist/*

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smtp-proxy-dist
          path: dist

      - name: Extract the release notes
        # CHANGES entries start at column 0 with `<version> <date> <author>`.
        # Print this version's block up to the next such heading.
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          awk -v v="$VERSION" '
            $1 == v { inblock = 1; next }
            inblock && /^[0-9]+\.[0-9]+\.[0-9]+ / { exit }
            inblock { print }
          ' CHANGES > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGES entry for ${VERSION}"
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: smtp-proxy ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  docker:
    name: Build and push the container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile does its own musl build: `rust:1-alpine` is already a
      # native musl host, so it needs no cross-compilation and shares nothing
      # with the job above.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smtp-proxy:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/smtp-proxy:latest
