[package]
name = "smtp-proxy"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "SMTP authentication and header injection proxy"
license = "GPL-3.0-or-later"
repository = "https://github.com/oposs/smtp-proxy-rs"

[[bin]]
name = "smtp-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
# TLS is ring-only: aws-lc-rs must stay out of the build graph, so the build
# needs no C/assembly toolchain and a static musl target stays reachable.
# Every `default-features = false` below is load-bearing. rustls and
# tokio-rustls both default to aws-lc-rs; worse, reqwest's plain `rustls`
# feature is *defined* as `__rustls-aws-lc-rs`, so it drags aws-lc-rs in no
# matter how our own rustls is configured. `rustls-no-provider` is the only
# way out, and it obliges us to install a provider ourselves -- see
# `smtp_proxy::install_crypto_provider`. `tests/crypto_provider.rs` goes red
# if any of this is tidied away.
#
# Accepted cost: rustls's `prefer-post-quantum` (hybrid X25519MLKEM768 key
# exchange) is defined as `prefer-post-quantum = ["aws_lc_rs"]`, so it is
# unreachable here. Wanting it back means taking aws-lc-rs back with it.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
nix = { version = "0.31", features = ["user", "hostname"] }
anyhow = "1"
thiserror = "2"
base64 = "0.23"
memchr = "2"
jiff = "0.2"
rand = "0.10"

[dev-dependencies]
axum = "0.8"
rcgen = "0.14"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
